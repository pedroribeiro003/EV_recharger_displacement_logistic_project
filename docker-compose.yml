services:

  # ── Banco de dados PostgreSQL + PostGIS ──────────────────────────────
  db:
    image: postgis/postgis:15-3.4
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ev_demand
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Poll contínuo (snapshots a cada POLL_INTERVAL segundos) ──────────
  poll:
    build: .
    command: ["python", "main.py", "ingest", "tupi", "--poll"]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${DB_PASSWORD:-changeme}@db:5432/ev_demand
      TUPI_BASE_URL: ${TUPI_BASE_URL:-https://api.tupinambaenergia.com.br}
      TUPI_ORIGIN: ${TUPI_ORIGIN:-https://tupimob.com}
      POLL_INTERVAL: ${POLL_INTERVAL:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # ── Enrich — roda uma vez para popular as estações ───────────────────
  enrich:
    build: .
    command: ["python", "main.py", "ingest", "tupi"]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${DB_PASSWORD:-changeme}@db:5432/ev_demand
      TUPI_BASE_URL: ${TUPI_BASE_URL:-https://api.tupinambaenergia.com.br}
      TUPI_ORIGIN: ${TUPI_ORIGIN:-https://tupimob.com}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["enrich"]

  # ── Pipeline completo (IBGE + ANP + IPEA + OSM) ──────────────────────
  ingest:
    build: .
    command: ["python", "main.py", "ingest", "all"]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${DB_PASSWORD:-changeme}@db:5432/ev_demand
      TUPI_BASE_URL: ${TUPI_BASE_URL:-https://api.tupinambaenergia.com.br}
      TUPI_ORIGIN: ${TUPI_ORIGIN:-https://tupimob.com}
      ANP_BASE_URL: ${ANP_BASE_URL:-https://www.anp.gov.br/api}
      IPEA_BASE_URL: ${IPEA_BASE_URL:-http://www.ipeadata.gov.br/api/odata4}
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["ingest"]

volumes:
  pgdata:
