services:

  # ── Banco de dados PostgreSQL + PostGIS ──────────────────────────────
  db:
    image: postgis/postgis:15-3.4
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ev_demand
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── run_all — verifica banco, ingere o que faltar, inicia poll ────────
  app:
    build: .
    command: ["python", "run_all.py"]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${DB_PASSWORD:-changeme}@db:5432/ev_demand
      TUPI_BASE_URL: ${TUPI_BASE_URL:-https://api.tupinambaenergia.com.br}
      TUPI_ORIGIN: ${TUPI_ORIGIN:-https://tupimob.com}
      POLL_INTERVAL: ${POLL_INTERVAL:-300}
      ANP_BASE_URL: ${ANP_BASE_URL:-https://www.anp.gov.br/api}
      IPEA_BASE_URL: ${IPEA_BASE_URL:-http://www.ipeadata.gov.br/api/odata4}
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
